### Extract the ONLYOFFICE headless runtime (x2t + docbuilder + dylibs + sdkjs)
### and publish per-platform tarballs as a GitHub release for downstream download
### (consumed by planoctl's resolver for egent-office — all four tools exec the
### binaries directly; no backing HTTP service).
###
### Sources:
###   linux   bin/   <- onlyoffice/documentserver image (x2t + docbuilder + .so)
###   linux   sdkjs/ <- onlyoffice/documentserver image
###   darwin  bin/   <- ONLYOFFICE/DocumentBuilder release archive
###                    (docbuilder + x2t + frameworks; the Desktop Editors DMG
###                     ships x2t but NOT docbuilder, so the Document Builder
###                     archive is the darwin docbuilder source)
###   darwin  sdkjs/ <- Desktop Editors DMG
###   windows bin/   <- ONLYOFFICE/DocumentBuilder release archive
###                    (onlyoffice-documentbuilder-windows-x64.zip: docbuilder.exe
###                     + x2t.exe + DLLs). Upstream publishes x64 only; arm64
###                    artifact repackages the x64 binaries (runs via Windows
###                    Prism x64 emulation on ARM64 hosts).
###   windows sdkjs/ <- onlyoffice/documentserver image (sdkjs is pure,
###                    platform-independent JS — the desktop bundle ships the same
###                    sdkjs as the server; extracting from the image avoids
###                    unpacking the Desktop Editors .exe installer)
###
### Trigger model mirrors metering/.github/workflows/release.yml: rebuild + republish
### on every push to the default branch. Source versions are pinned in env: below —
### bump PINNED_DS_TAG / PINNED_DMG_VERSION and push to roll to a new ONLYOFFICE
### release (Document Builder tracks the same version). workflow_dispatch lets you
### override for one-off extractions.
###
### Artifacts (each self-contained: bin/ + sdkjs/):
###   office-runtime-linux-amd64.tar.gz   <- documentserver image
###   office-runtime-linux-arm64.tar.gz   <- documentserver image
###   office-runtime-darwin-arm64.tar.gz  <- DocumentBuilder archive + DMG sdkjs
###   office-runtime-darwin-amd64.tar.gz  <- DocumentBuilder archive + DMG sdkjs
###   office-runtime-windows-amd64.tar.gz <- DocumentBuilder win-x64 zip + image sdkjs
###   office-runtime-windows-arm64.tar.gz <- DocumentBuilder win-x64 zip + image sdkjs
###                                          (x64 binaries; runs via Prism emulation)
###
### Note: `docker cp` / `cp` from a *created* (not started) container/DMG never
### executes the foreign-arch binary, so arm64 extraction on an amd64 runner
### works without emulation.
###
### License note: the free Document Builder permits builder.CreateFile (new
### documents) but gates builder.OpenFile (editing existing documents) behind a
### commercial license. egent-office works around this: create_document uses
### docbuilder (CreateFile), while edit_document uses pure-Go gooxml (no
### docbuilder, no license). So all four egent-office tools work on every
### platform regardless of the Document Builder license.
name: Extract ONLYOFFICE runtime
run-name: "extract runtime-v${{ github.run_number }}${{ github.event_name == 'workflow_dispatch' && format(' (ds={0}, desktop=v{1})', inputs.ds_tag, inputs.dmg_version) || '' }}"

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      ds_tag:
        description: "onlyoffice/documentserver image tag, no leading v (e.g. 9.4.0). Empty = use PINNED_DS_TAG."
        type: string
        required: false
        default: ""
      dmg_version:
        description: "ONLYOFFICE Desktop Editors version, no leading v (e.g. 9.4.0). Empty = use PINNED_DMG_VERSION."
        type: string
        required: false
        default: ""
      release_tag:
        description: "Release tag (e.g. runtime-v9.4.0). Empty = runtime-v<run_number> (auto-increment)."
        type: string
        required: false
        default: ""

permissions:
  contents: write

env:
  DS_IMAGE: onlyoffice/documentserver
  # Pinned source versions used on branch pushes. Bump + push to roll forward.
  PINNED_DS_TAG: "9.4.0"
  PINNED_DMG_VERSION: "9.4.0"

jobs:
  # --------------------------------------------------------------------------- #
  # linux/amd64 + linux/arm64: pull the official image, copy out bin + sdkjs.
  # --------------------------------------------------------------------------- #
  extract-linux:
    name: "linux/${{ matrix.arch }}"
    runs-on: ubuntu-latest
    outputs:
      ds_tag: ${{ steps.tag.outputs.ds_tag }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Resolve DocumentServer tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          v="${{ inputs.ds_tag }}"
          [ -z "${v}" ] && v="${PINNED_DS_TAG}"
          echo "ds_tag=${v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (multi-arch image pull)
        uses: docker/setup-qemu-action@v4

      - name: Pull image and extract converter + sdkjs
        shell: bash
        env:
          PLATFORM: linux/${{ matrix.arch }}
          DS_TAG: ${{ steps.tag.outputs.ds_tag }}
        run: |
          set -euo pipefail
          docker pull --platform "${PLATFORM}" "${DS_IMAGE}:${DS_TAG}"
          cid="$(docker create --platform "${PLATFORM}" "${DS_IMAGE}:${DS_TAG}")"
          echo "container: ${cid}"
          mkdir -p out/bin out/sdkjs
          # Stream as tar and extract WITHOUT preserving source ownership/modes.
          # The image ships template files (bin/empty/*.docx) with restrictive
          # perms that make a plain `docker cp` into the runner workspace fail
          # with "permission denied". --no-same-owner extracts as the runner
          # user; --no-same-permissions applies the umask. bin = x2t + docbuilder
          # + companion shared libs (.so); sdkjs = JS Api scripts (docbuilder only).
          # Path confirmed by config/supervisor/ds/ds-converter.conf (LD_LIBRARY_PATH).
          docker cp "${cid}:/var/www/onlyoffice/documentserver/server/FileConverter/bin/." - \
            | tar -x --no-same-owner --no-same-permissions -C out/bin
          docker cp "${cid}:/var/www/onlyoffice/documentserver/sdkjs/." - \
            | tar -x --no-same-owner --no-same-permissions -C out/sdkjs
          docker rm "${cid}" >/dev/null
          # sanity check the two binaries we depend on are present
          test -f out/bin/x2t
          test -f out/bin/docbuilder
          echo "::notice::extracted $(ls out/bin | wc -l) bin entries, $(find out/sdkjs -type f | wc -l) sdkjs files"
          tar -C out -czf "office-runtime-linux-${{ matrix.arch }}.tar.gz" bin sdkjs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: office-runtime-linux-${{ matrix.arch }}
          path: office-runtime-linux-${{ matrix.arch }}.tar.gz
          retention-days: 14
          if-no-files-found: error

  # --------------------------------------------------------------------------- #
  # darwin/arm64 + darwin/amd64: mount the Desktop Editors DMG, copy converter
  # (x2t/docbuilder/dylibs) + sdkjs out of the .app bundle. Runs on a macOS
  # runner; copying files from the mounted DMG never executes them, so both
  # architectures can be extracted on the macos-14 (arm64) runner.
  # --------------------------------------------------------------------------- #
  extract-darwin:
    name: "darwin/${{ matrix.arch }}"
    runs-on: macos-14
    outputs:
      dmg_version: ${{ steps.tag.outputs.dmg_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            dmg: ONLYOFFICE-arm.dmg
          - arch: amd64
            dmg: ONLYOFFICE-x86_64.dmg
    steps:
      - name: Resolve versions
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          v="${{ inputs.dmg_version }}"
          [ -z "${v}" ] && v="${PINNED_DMG_VERSION}"
          echo "dmg_version=${v}" >> "$GITHUB_OUTPUT"
          # Document Builder releases track the same version as Desktop Editors /
          # DocumentServer (9.4.0, ...). It is the source of the darwin docbuilder
          # binary (the Desktop Editors DMG ships x2t but NOT docbuilder).
          echo "db_version=${v}" >> "$GITHUB_OUTPUT"

      - name: Download Document Builder archive (docbuilder + x2t + frameworks)
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          DB_VERSION: ${{ steps.tag.outputs.db_version }}
        run: |
          set -euo pipefail
          # The Desktop Editors DMG ships x2t + frameworks but NOT docbuilder.
          # ONLYOFFICE publishes a precompiled macOS Document Builder at
          # version-matched releases — a complete, self-consistent headless
          # runtime (docbuilder + x2t + frameworks + DoctRenderer.config). We use
          # it as the bin/ source so docbuilder and its libs come from one build.
          # sdkjs still comes from the DMG (sibling of bin/). Verified: docbuilder
          # CreateFile + x2t convert/extract both work from this layout.
          case "${ARCH}" in
            arm64) asset="onlyoffice-documentbuilder-macos-arm64.tar.xz" ;;
            amd64) asset="onlyoffice-documentbuilder-macos-x86_64.tar.xz" ;;
          esac
          url="https://github.com/ONLYOFFICE/DocumentBuilder/releases/download/v${DB_VERSION}/${asset}"
          echo "Downloading ${url}"
          curl -fL --retry 3 -o db.tar.xz "${url}"
          mkdir -p out/bin
          tar -xf db.tar.xz -C out/bin
          xattr -cr out/bin || true
          chmod +x out/bin/docbuilder out/bin/x2t 2>/dev/null || true
          # docbuilder is the whole point; x2t + frameworks are also present.
          test -f out/bin/docbuilder || { echo "docbuilder missing from archive" >&2; exit 1; }
          test -f out/bin/x2t || { echo "x2t missing from archive" >&2; exit 1; }
          echo "::notice::Document Builder bin: $(ls out/bin | wc -l) entries (docbuilder + x2t + frameworks)"

      - name: Mount Desktop Editors DMG + extract sdkjs
        shell: bash
        env:
          DMG: ${{ matrix.dmg }}
          VERSION: ${{ steps.tag.outputs.dmg_version }}
        run: |
          set -euo pipefail
          url="https://github.com/ONLYOFFICE/DesktopEditors/releases/download/v${VERSION}/${DMG}"
          echo "Downloading ${url}"
          curl -fL --retry 3 -o ONLYOFFICE.dmg "${url}"
          hdiutil attach ONLYOFFICE.dmg -nobrowse -mountpoint /Volumes/ONLYOFFICE
          ls /Volumes/ONLYOFFICE
          APP="/Volumes/ONLYOFFICE/ONLYOFFICE.app"
          [ -d "${APP}" ] || { echo "ONLYOFFICE.app not found at ${APP}" >&2; exit 1; }
          # sdkjs scripts (docbuilder needs them at runtime). The desktop bundle
          # ships the same sdkjs as the server.
          mkdir -p out/sdkjs
          SDKJS="$(find "${APP}" -type d -name sdkjs -print -quit)"
          if [ -n "${SDKJS}" ]; then
            echo "sdkjs dir: ${SDKJS}"
            cp -R "${SDKJS}/." out/sdkjs
          else
            echo "::warning::sdkjs dir not found in bundle; tarball will carry binaries only"
          fi
          echo "extracted $(ls out/bin | wc -l) bin entries, $(find out/sdkjs -type f 2>/dev/null | wc -l) sdkjs files"

          # strip quarantine / extended attrs so extracted binaries run on the dev host
          xattr -cr out || true
          tar -C out -czf "office-runtime-darwin-${{ matrix.arch }}.tar.gz" bin sdkjs

      - name: Detach DMG
        if: always()
        shell: bash
        run: |
          hdiutil detach /Volumes/ONLYOFFICE -force >/dev/null 2>&1 || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: office-runtime-darwin-${{ matrix.arch }}
          path: office-runtime-darwin-${{ matrix.arch }}.tar.gz
          retention-days: 14
          if-no-files-found: error

  # --------------------------------------------------------------------------- #
  # windows/amd64 + windows/arm64: Document Builder Windows archive (docbuilder.exe
  # + x2t.exe + DLLs) + sdkjs from the documentserver image. Runs on ubuntu-latest
  # — we only ever COPY the PE binaries, never execute them, so no windows runner
  # is needed. Upstream publishes x64 only; arm64 artifact repackages the x64
  # binaries (runs via Windows Prism x64 emulation on ARM64 hosts).
  # --------------------------------------------------------------------------- #
  extract-windows:
    name: "windows/${{ matrix.arch }}"
    runs-on: ubuntu-latest
    outputs:
      db_version: ${{ steps.tag.outputs.db_version }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Resolve versions
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          v="${{ inputs.dmg_version }}"
          [ -z "${v}" ] && v="${PINNED_DMG_VERSION}"
          # Document Builder releases track the same version across platforms
          # (9.4.0, ...) — same resolution as the darwin job.
          echo "db_version=${v}" >> "$GITHUB_OUTPUT"
          ds="${{ inputs.ds_tag }}"
          [ -z "${ds}" ] && ds="${PINNED_DS_TAG}"
          echo "ds_tag=${ds}" >> "$GITHUB_OUTPUT"

      - name: Download Document Builder Windows archive (docbuilder + x2t + DLLs)
        shell: bash
        env:
          DB_VERSION: ${{ steps.tag.outputs.db_version }}
        run: |
          set -euo pipefail
          # Same source family as the darwin job, Windows flavor: a complete,
          # self-consistent headless runtime (docbuilder.exe + x2t.exe + DLLs +
          # DoctRenderer.config). zip, not tar.xz, on Windows. Upstream publishes
          # x64 only — arm64 artifact repackages the same x64 binaries (runs via
          # Windows Prism x64 emulation on ARM64 hosts).
          asset="onlyoffice-documentbuilder-windows-x64.zip"
          url="https://github.com/ONLYOFFICE/DocumentBuilder/releases/download/v${DB_VERSION}/${asset}"
          echo "Downloading ${url}"
          curl -fL --retry 3 -o db.zip "${url}"
          mkdir -p out/bin
          unzip -q db.zip -d out/bin
          # Some archives wrap content in a top-level dir; flatten if so.
          if [ ! -f out/bin/docbuilder.exe ] && [ "$(ls out/bin | wc -l)" -eq 1 ]; then
            inner="$(ls out/bin | head -1)"
            mv "out/bin/${inner}/." out/bin/ && rmdir "out/bin/${inner}"
          fi
          test -f out/bin/docbuilder.exe || { echo "docbuilder.exe missing from archive" >&2; exit 1; }
          test -f out/bin/x2t.exe || { echo "x2t.exe missing from archive" >&2; exit 1; }
          echo "::notice::Document Builder bin: $(ls out/bin | wc -l) entries (docbuilder.exe + x2t.exe + DLLs)"

      - name: Extract sdkjs from documentserver image
        shell: bash
        env:
          DS_TAG: ${{ steps.tag.outputs.ds_tag }}
        run: |
          set -euo pipefail
          # sdkjs is platform-independent JS (the desktop bundle ships the same
          # sdkjs as the server) — take it from the version-matched image instead
          # of unpacking the Desktop Editors Windows .exe installer.
          docker pull --platform linux/amd64 "${DS_IMAGE}:${DS_TAG}"
          cid="$(docker create --platform linux/amd64 "${DS_IMAGE}:${DS_TAG}")"
          mkdir -p out/sdkjs
          docker cp "${cid}:/var/www/onlyoffice/documentserver/sdkjs/." - \
            | tar -x --no-same-owner --no-same-permissions -C out/sdkjs
          docker rm "${cid}" >/dev/null
          echo "extracted $(ls out/bin | wc -l) bin entries, $(find out/sdkjs -type f | wc -l) sdkjs files"
          tar -C out -czf "office-runtime-windows-${{ matrix.arch }}.tar.gz" bin sdkjs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: office-runtime-windows-${{ matrix.arch }}
          path: office-runtime-windows-${{ matrix.arch }}.tar.gz
          retention-days: 14
          if-no-files-found: error

  # --------------------------------------------------------------------------- #
  # Publish all platform tarballs to a versioned GitHub release. softprops handles
  # create-or-update so re-runs with the same tag are idempotent.
  # --------------------------------------------------------------------------- #
  release:
    name: "Publish runtime release"
    runs-on: ubuntu-latest
    needs: [extract-linux, extract-darwin, extract-windows]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: rel
        shell: bash
        run: |
          set -euo pipefail
          t="${{ inputs.release_tag }}"
          if [ -z "${t}" ]; then t="runtime-v${{ github.run_number }}"; fi
          echo "tag=${t}" >> "$GITHUB_OUTPUT"

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        shell: bash
        run: |
          set -euo pipefail
          ls -la artifacts/
          echo "---"
          ls -la artifacts/*.tar.gz

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.tag }}
          generate_release_notes: true
          body: |
            Headless ONLYOFFICE runtime for `egent-office` (x2t + docbuilder + dylibs + sdkjs).

            Source: DocumentServer `${{ needs.extract-linux.outputs.ds_tag }}` (linux),
            Desktop Editors `v${{ needs.extract-darwin.outputs.dmg_version }}` (darwin),
            Document Builder `v${{ needs.extract-windows.outputs.db_version }}` (windows).

            | Artifact | GOOS / GOARCH | Source |
            | --- | --- | --- |
            | `office-runtime-linux-amd64.tar.gz` | linux/amd64 | documentserver image |
            | `office-runtime-linux-arm64.tar.gz` | linux/arm64 | documentserver image |
            | `office-runtime-darwin-arm64.tar.gz` | darwin/arm64 | `ONLYOFFICE-arm.dmg` |
            | `office-runtime-darwin-amd64.tar.gz` | darwin/amd64 | `ONLYOFFICE-x86_64.dmg` |
            | `office-runtime-windows-amd64.tar.gz` | windows/amd64 | DocumentBuilder win-x64 zip + image sdkjs |
            | `office-runtime-windows-arm64.tar.gz` | windows/arm64 | DocumentBuilder win-x64 zip (Prism emulation) + image sdkjs |

            Each tarball expands to `bin/` (x2t, docbuilder, shared libs) + `sdkjs/` (JS Api scripts).
            Windows arm64 uses x64 binaries — runs via Windows Prism x64 emulation on ARM64 hosts.
          files: |
            artifacts/office-runtime-linux-amd64.tar.gz
            artifacts/office-runtime-linux-arm64.tar.gz
            artifacts/office-runtime-darwin-arm64.tar.gz
            artifacts/office-runtime-darwin-amd64.tar.gz
            artifacts/office-runtime-windows-amd64.tar.gz
            artifacts/office-runtime-windows-arm64.tar.gz
